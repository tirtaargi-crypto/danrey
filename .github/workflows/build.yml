
name: DanRey Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: 'yes'
          log-accepted-android-sdk-licenses: 'false'

      - name: Check Repository
        run: |
          echo "Repository files:"
          ls -la
          test -f base.zip || {
            echo "ERROR: base.zip tidak ditemukan"
            exit 1
          }

      - name: Extract ZIP
        run: |
          mkdir -p workspace
          unzip -o base.zip -d workspace
          find workspace -maxdepth 3 -type f | head -100

      - name: Check Android Project
        run: |
          if [ ! -f workspace/gradlew ]; then
            echo "ERROR: gradlew tidak ditemukan."
            echo "File base.zip bukan source project Gradle Android yang lengkap."
            exit 1
          fi

      - name: Build APK
        run: |
          cd workspace
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DanRey-APK
          path: workspace/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
