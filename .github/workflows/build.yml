
name: DanRey Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          set -o pipefail
          yes | sdkmanager --licenses

      - name: Check Project Files
        run: |
          echo "Checking repository..."
          ls -la
          echo "Checking base.zip..."
          test -f base.zip || {
            echo "ERROR: base.zip tidak ditemukan"
            exit 1
          }

      - name: Extract Base ZIP
        run: |
          mkdir -p workspace
          unzip -o base.zip -d workspace
          echo "ZIP extracted successfully"
          find workspace -maxdepth 3 -type f | head -100

      - name: Build Project
        shell: bash
        run: |
          cd workspace

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          elif [ -f build.gradle ] || [ -f build.gradle.kts ]; then
            gradle assembleDebug
          else
            echo "ERROR: Tidak ditemukan project Gradle Android."
            echo "ZIP ini harus berisi source project Android, bukan hanya file APK."
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DanRey-APK
          path: |
            workspace/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
